<meta property="og:type" content="website">
<meta property="og:site_name" content="Akshay Naik">
<meta property="og:title" content="Portfolio · Akshay Naik">
<meta property="og:description" content="Projects by Akshay Naik.">
<meta property="og:url" content="https://aknaik.com/portfolio/">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #FBF7EC;
    --ink: #2B2B2B;
    --muted: #8A8478;
    --link: #8B3A2B;
    --art: #D9D1BF;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Crimson Text", serif;
    --mono: "IBM Plex Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }

  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }

  body {
    min-height: 100vh;
    margin: 0;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: oldstyle-nums proportional-nums;
    text-rendering: optimizeLegibility;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 556px;
    padding: 5rem 1.5rem 6rem;
  }

  h1 {
    margin: 0 0 1.5rem;
    font-size: 36px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.025em;
  }

  a {
    color: var(--link);
    text-decoration-thickness: 0.05em;
    text-underline-offset: 0.12em;
  }

  footer {
    margin-top: 3em;
    font-size: 0.95em;
    color: var(--muted);
  }

  #ascii-art {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    margin: 0;
    color: var(--art);
    font-family: var(--mono);
    font-size: max(0.57vw, 3px);
    line-height: 1;
    white-space: pre;
    pointer-events: none;
  }


  /* project entries (copy one from portfolio/_template.html) */
  .project { margin-top: 3rem; }
  .project h2 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: -0.01em; }
  .project .meta { margin: 0.15rem 0 0.6rem; color: var(--muted); font-size: 0.95em; }
  .project p { margin: 0 0 0.9rem; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.6rem; margin-bottom: 0.7rem; }
  .shots img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #ECE5D5; }
  .shots img:only-child { width: calc(50% - 0.3rem); }
  .skills { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .project .links { margin-top: 0.3rem; font-size: 0.95em; }

  @media (max-width: 722px) {
    .shots img:only-child { width: 100%; }
    .content { padding: 3rem 1.5rem 4rem; }
    h1 { font-size: 30px; }
    body { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="content">
  <h1>Portfolio</h1>

</body>
</html>
