<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshay Naik</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #FBF7EC;
    --ink: #2B2B2B;
    --muted: #8A8478;
    --link: #8B3A2B;
    --art: #CFC6B2;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Crimson Text", serif;
    --mono: "IBM Plex Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }

  html {
    scrollbar-width: none;            /* page still scrolls, scrollbar just hidden */
  }
  html::-webkit-scrollbar { display: none; }

  body {
    min-height: 100vh;
    margin: 0;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: oldstyle-nums proportional-nums;
    text-rendering: optimizeLegibility;
  }

  /* left-aligned column that sits above the art */
  .content {
    position: relative;
    z-index: 1;
    max-width: 556px;
    padding: 5rem 1.5rem 6rem;
  }

  h1 {
    margin: 0 0 1.5rem;
    font-size: 36px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.025em;
  }

  a {
    color: var(--link);
    text-decoration-thickness: 0.05em;
    text-underline-offset: 0.12em;
  }

  footer {
    margin-top: 3em;
    font-size: 0.95em;
    color: var(--muted);
  }

  /* faint strip of ASCII hills along the bottom of the window, behind the text */
  #ascii-art {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    margin: 0;
    color: var(--art);
    font-family: var(--mono);
    font-size: max(0.57vw, 3px);   /* 300 columns fill the width */
    line-height: 1;
    white-space: pre;
    pointer-events: none;
  }

  @media (max-width: 722px) {
    #ascii-art { display: none; }
    .content { padding: 3rem 1.5rem 4rem; }
    h1 { font-size: 30px; }
    body { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="content">
  <h1>Akshay Naik</h1>
  Computer Engineering '29 @ University of Illinois Urbana-Champaign <br>
  Minors: Quantum Information Science, Psychology <br>
  Hobbies: Chess, Clash Royale <br>
  <br>
  <a href="/portfolio/">Portfolio</a><br>
  <a href="/resume.pdf">Resume</a>
</div>

<div id="ascii-art" aria-hidden="true"></div>

<script src="/assets/ascii-arts.js"></script>
</body>
</html>
